<section class="create-page">
  <mat-card class="create-card" appearance="outlined">
    <div class="create-hero">
      <div class="create-avatar">
        <mat-icon>edit_note</mat-icon>
      </div>
      <div class="create-identity">
        <h1>Neuer Blog</h1>
        <p class="create-subtitle">Teile deine Gedanken mit der Community.</p>
      </div>
    </div>

    <mat-divider />

    <mat-card-content class="create-content">
      <form (submit)="onSubmit($event)" class="create-form">
        <mat-form-field appearance="outline">
          <mat-label>Titel</mat-label>
          <input matInput type="text" [formField]="blogForm.title" data-testid="create-title" />
          <mat-icon matSuffix>title</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Inhalt</mat-label>
          <textarea
            matInput
            rows="8"
            [formField]="blogForm.content"
            data-testid="create-content"
          ></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Kategorie</mat-label>
          <mat-select [formField]="blogForm.category" data-testid="create-category">
            @for (category of categories; track category) {
              <mat-option [value]="category">{{ category }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <div class="create-actions">
          <button mat-flat-button color="primary" type="submit" data-testid="create-submit">
            <mat-icon>send</mat-icon>
            Veröffentlichen
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
