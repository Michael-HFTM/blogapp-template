<header class="blog-list-header">
  <h1>Blog</h1>
  <p class="subtitle-row">
    <span>Artikel aus dem HFTM Web Applications Kurs</span>
    @if (loading()) {
      <span class="loading-indicator">Laden...</span>
    }
  </p>
</header>

<section class="blog-list">
  @for (blog of blogs(); track blog.id) {
    <app-blog-card [blog]="blog" (like)="onLiked($event)"></app-blog-card>
  } @empty {
    <p>No blogs found.</p>
  }
</section>
