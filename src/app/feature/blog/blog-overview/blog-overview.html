<header class="blog-list-header">
  <h1>Blog</h1>
  <p>Artikel aus dem HFTM Web Applications Kurs</p>
</header>

<section class="blog-list">
  @for (blog of blogs(); track blog.id) {
    <app-blog-card [blog]="blog" (like)="onLiked($event)"></app-blog-card>
  } @empty {
    <p>No blogs found.</p>
  }
</section>
