@if (blog(); as blog) {
  <article class="blog-detail">
    <div class="blog-hero" [class.blog-hero--no-image]="!blog.headerImageUrl">
      @if (blog.headerImageUrl) {
        <img class="blog-image" [src]="blog.headerImageUrl" [alt]="blog.title" />
      }
      <div class="blog-hero-overlay">
        <h1>{{ blog.title }}</h1>
        <div class="blog-meta">
          <span class="meta-chip">
            <mat-icon>person</mat-icon>
            {{ blog.author }}
          </span>
          <span class="meta-chip">
            <mat-icon>calendar_today</mat-icon>
            {{ blog.createdAt | date: 'dd. MMM yyyy' }}
          </span>
          <span class="meta-chip">
            <mat-icon>favorite</mat-icon>
            {{ blog.likes }}
          </span>
          <span class="meta-chip">
            <mat-icon>chat_bubble_outline</mat-icon>
            {{ blog.comments.length }}
          </span>
        </div>
      </div>
    </div>

    <div class="blog-content">
      <p>{{ blog.content }}</p>
    </div>
  </article>
} @else {
  <p>Blog-Post nicht gefunden.</p>
}
