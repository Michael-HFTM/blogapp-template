<mat-card class="blog-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ blog().title }}</mat-card-title>
    <mat-card-subtitle>{{ blog().author }}</mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-image
    [src]="blog().headerImageUrl ?? 'empty-card-placeholder.svg'"
    alt="Blog header image"
  />
  <mat-card-content>
    <p>{{ blog().contentPreview }}</p>
  </mat-card-content>
  <mat-card-actions align="end">
    <button matIconButton aria-label="Like" (click)="emitLike()">
      <mat-icon>{{ liked ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
    <button matIconButton aria-label="Comment">
      <mat-icon>chat_bubble_outline</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
