<mat-card class="blog-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ blog().title }}</mat-card-title>
    <mat-card-subtitle>{{ blog().author }}</mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-image
    [src]="blog().headerImageUrl ?? 'empty-card-placeholder.svg'"
    alt="Blog header image"
  />
  <mat-card-content>
    <p>{{ blog().contentPreview }}</p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
  </mat-card-actions>
</mat-card>
