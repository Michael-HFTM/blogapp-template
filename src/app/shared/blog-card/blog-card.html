<mat-card class="blog-card" appearance="outlined" routerLink="/blog/{{ blog().id }}">
  <mat-card-header>
    <mat-icon matCardAvatar class="author-avatar">person</mat-icon>
    <mat-card-title>{{ blog().title }}</mat-card-title>
    <mat-card-subtitle>{{ blog().author }}</mat-card-subtitle>
  </mat-card-header>
  <img
    mat-card-image
    [src]="blog().headerImageUrl ?? 'empty-card-placeholder.svg'"
    alt="Blog header image"
  />
  <mat-card-content>
    <p>{{ blog().contentPreview }}</p>
  </mat-card-content>
  <mat-card-actions align="end">
    <button matIconButton aria-label="Like" (click)="$event.stopPropagation(); emitLike()">
      <mat-icon>{{ blog().likedByMe ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
    <span class="like-count">{{ blog().likes }}</span>
    <!-- Kein Button: Kommentare stehen im Beitrag, und die ganze Karte verlinkt
         bereits dorthin. Ein Button ohne Aktion verspricht mehr, als er hält. -->
    <span class="comment-count" [attr.aria-label]="blog().comments + ' Kommentare'">
      <mat-icon>chat_bubble_outline</mat-icon>
      {{ blog().comments }}
    </span>
  </mat-card-actions>
</mat-card>
